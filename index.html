<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMR AGV — Smart Logistics Factory</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
:root{--bg:#0a0a0b;--fg:#f3f3f0;--mute:#8b8e97;--line:#2a2c31;--amr:#16b4cc;--agv:#f5b400;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Bebas Neue','Noto Sans KR',Impact,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:clamp(24px,5vh,56px);padding:clamp(28px,7vh,80px) max(16px,6vw)}
h1{font-weight:400;font-size:clamp(64px,12vw,220px);line-height:.86;margin:0}
.team{font-size:clamp(18px,1.8vw,28px);letter-spacing:.1em;color:var(--mute)}
nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,2vw,24px)}
a{display:block;color:var(--fg);text-decoration:none;border-top:4px solid var(--fg);padding-top:16px;transition:color .2s,border-color .2s}
a b{display:block;font-weight:400;font-size:clamp(44px,6vw,110px);line-height:.9}
a span{display:block;font-size:clamp(16px,1.4vw,22px);letter-spacing:.1em;color:var(--mute);margin-top:8px}
a.m:hover{color:var(--amr);border-color:var(--amr)}a.f:hover{color:var(--agv);border-color:var(--agv)}
a:focus-visible{outline:3px solid var(--amr);outline-offset:6px}
@media (max-width:600px){nav{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <div>
    <h1>Smart Logistics<br>Factory</h1>
    <p class="team">TEAM AMR &amp; AGV · LEE GYUMIN · YOO JUCHAN · JO CHANHEE · KIM HEEWON · LEE KIHUN</p>
  </div>
  <nav>
    <a class="m" href="mid/"><b>Mid-term →</b><span>중간발표 · 59 SLIDES</span></a>
    <a class="f" href="final/"><b>Final →</b><span>기말발표 미리보기 · 3D</span></a>
  </nav>
</main>
</body>
</html>
